x-world: &world
  image: dsh-remote-e2e-world:local
  build:
    context: ../../../..
    dockerfile: integrations/dsh/tests/e2e/Dockerfile
  ports:
    - "127.0.0.1::22"
  healthcheck:
    test: ["CMD", "/usr/sbin/sshd", "-t"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  world-a:
    <<: *world
    environment:
      DSH_E2E_PUBLIC_KEY: ${DSH_E2E_PUBLIC_KEY:?generated by the runner}
      WORLD_ID: a
  world-b:
    <<: *world
    environment:
      DSH_E2E_PUBLIC_KEY: ${DSH_E2E_PUBLIC_KEY:?generated by the runner}
      WORLD_ID: b
