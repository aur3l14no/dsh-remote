# Host-only configuration is supplied explicitly by the launcher.
- id: session-controller
  config:
    nativeOpen: false
- id: agent-presets
  config:
    includeShippedRoot: false
    includeUserRoot: false
- id: workspace
  disabled: true
- id: ui-workspace
  disabled: true
- id: directory-picker
  disabled: true
- id: session-reference
  disabled: true
- id: file-reference-local
  disabled: true
- id: fs-sandbox
  disabled: true
- id: subprocess
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- insert:
    - id: remote-workspaces
      name: '@dsh-remote/web'
      config: !!js JSON.parse(process.env.DSH_REMOTE_CONFIG)
    - id: remote-workspace-ui
      name: '@dsh-remote/web-ui'
