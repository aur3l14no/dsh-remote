# Native bundle overlay; inserted paths are anchored beside this file by DSH.
- id: session-controller
  config:
    nativeOpen: false
- id: agent-presets
  config:
    includeShippedRoot: false
    includeUserRoot: false
- id: skill
  config:
    cache: false
- id: skill-filesystem
  disabled: true
- id: workspace
  disabled: true
- id: ui-workspace
  disabled: true
- id: directory-picker
  disabled: true
- id: session-reference
  disabled: true
- id: file-reference-local
  disabled: true
- id: fs-sandbox
  disabled: true
- id: subprocess
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: permission
  disabled: true
- id: ui-permission
  disabled: true
- insert:
    - id: remote-workspaces
      name: './plugins/web/lib/index.js'
      inject: [remoteSetup]
      config: !!js ctx.remoteSetup.config
    - id: remote-workspace-ui
      name: './plugins/web-ui/lib/index.js'
      inject: [remoteSetup]
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true

- id: session-controller
  disabled: true
- id: workspace-controller
  disabled: true
- id: skill
  disabled: true
- insert:
    - id: remote-setup
      name: './setup.mjs'
    - id: remote-session-controller
      name: './compat/@deepseek-ai/dsh-api-session-controller/lib/index.js'
      inject: [remoteSetup]
      config:
        nativeOpen: false
    - id: remote-workspace-controller
      name: './compat/@deepseek-ai/dsh-api-workspace-controller/lib/index.js'
      inject: [remoteSetup]
    - id: remote-skill
      name: './compat/@deepseek-ai/dsh-skill/lib/index.js'
      inject: [remoteSetup]
      config:
        cache: false
- id: agent-presets
  inject: [remoteSetup]
  config:
    default: remote
    includeShippedRoot: false
    includeUserRoot: false
    roots: !!js ctx.remoteSetup.roots
