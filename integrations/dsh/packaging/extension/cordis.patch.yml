# Native bundle overlay; inserted paths are anchored beside this file by DSH.
- id: session-controller
  config:
    nativeOpen: false
- id: agent-presets
  config:
    includeShippedRoot: false
    includeUserRoot: false
- id: skill
  config:
    cache: false
- id: skill-filesystem
  disabled: true
- id: workspace
  disabled: true
- id: ui-workspace
  disabled: true
- id: session-reference
  disabled: true
- id: file-reference-local
  disabled: true
- id: sandbox-policy
  disabled: true
- id: permission
  disabled: true
- insert:
    - id: remote-workspaces
      name: './plugins/web/lib/index.js'
      inject: [remoteSetup]
      config: !!js ctx.remoteSetup.config
    - id: remote-workspace-ui
      name: './plugins/web-ui/lib/index.js'
      inject: [remoteSetup]
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true

- id: session-controller
  disabled: true
- id: workspace-controller
  disabled: true
- id: skill
  disabled: true
- insert:
    - id: remote-setup
      name: './setup.mjs'
    - id: remote-session-controller
      name: './compat/@deepseek-ai/dsh-api-session-controller/lib/index.js'
      inject: [remoteSetup]
      config:
        nativeOpen: false
    - id: remote-workspace-controller
      name: './compat/@deepseek-ai/dsh-api-workspace-controller/lib/index.js'
      inject: [remoteSetup]
    - id: remote-skill
      name: './compat/@deepseek-ai/dsh-skill/lib/index.js'
      inject: [remoteSetup]
      config:
        cache: false
- id: agent-presets
  disabled: true
- insert:
    - id: world-agent-presets
      name: './plugins/web/lib/presets.js'
      inject: [remoteSetup]
      config:
        default: remote
        includeShippedRoot: false
        includeUserRoot: false
        roots: !!js ctx.remoteSetup.roots
    - id: world-permission
      name: './compat/@deepseek-ai/dsh-permission-presets/lib/index.js'
      inject: [remoteSetup, sessionPermissionDefaults]
      config:
        defaultPreset: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

- id: workspace-files
  disabled: true
- id: ui-chat
  disabled: true
- id: ui-deliverables
  disabled: true
- insert:
    - id: remote-ui-deliverables
      name: './compat/@deepseek-ai/dsh-client-ui-deliverables/lib/index.js'
      inject: [remoteSetup]
    - id: remote-workspace-files
      name: './compat/@deepseek-ai/dsh-api-workspace-files/lib/index.js'
      inject: [remoteSetup, workspaceFileEnvironment]
    - id: remote-ui-chat
      name: './compat/@deepseek-ai/dsh-client-ui-chat/lib/index.js'
      inject: [remoteSetup]

# Attachment writes and model reads select an explicit Session environment.
# Include patch names are assertions; replacements require disable + insert.
- id: attachment-local
  disabled: true
- id: llm
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: file-upload
  disabled: true
- id: subagent
  disabled: true
- id: session-log-download
  disabled: true
- insert:
    - id: remote-attachments
      name: './plugins/web/lib/attachments.js'
      inject: [remoteSetup, executionWorlds, worldPortableWorkspaces]
    - id: remote-llm
      name: './compat/@deepseek-ai/dsh-llm/lib/index.js'
    - id: remote-llm-deepseek
      name: './compat/@deepseek-ai/dsh-llm-deepseek/lib/index.js'
    - id: remote-llm-pi-ai
      name: './compat/@deepseek-ai/dsh-llm-pi-ai/lib/index.js'
    - id: remote-file-upload
      name: './compat/@deepseek-ai/dsh-client-file-upload/lib/index.js'
    - id: remote-subagent
      name: './compat/@deepseek-ai/dsh-subagent/lib/index.js'
    - id: remote-session-log-download
      name: './compat/@deepseek-ai/dsh-session-log-export/lib/index.js'

- id: ui-sidebar-right
  disabled: true
- insert:
    - id: remote-ui-sidebar-right
      name: './compat/@deepseek-ai/dsh-client-ui-sidebar-right/lib/index.js'
      inject: [remoteSetup]

- id: ui-sidebar
  disabled: true
- insert:
    - id: world-ui-sidebar
      name: './compat/@deepseek-ai/dsh-client-ui-sidebar/lib/index.js'
      inject: [remoteSetup]
