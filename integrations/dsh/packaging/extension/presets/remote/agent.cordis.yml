- id: remote-capabilities
  name: '@deepseek-ai/cordis-plugin-group'
  isolate:
    fs: true
    subprocess: true
    shell: true
    toolBashWorkdir: true
    terminals: true
  config:
    - name: '../../plugins/web/lib/fs.js'
    - name: '../../plugins/web/lib/subprocess.js'
    - name: '../../plugins/web/lib/routing.js'
      config:
        providerPaths: true
        kind: ssh
    - name: '../../plugins/web/lib/approval.js'
    - name: '@deepseek-ai/dsh-bash-local'
      config:
        maxSpillBytes: 4194304
    - name: '../../compat/@deepseek-ai/dsh-tool-bash/lib/index.js'
      config:
        enableRunInBackground: true
    - name: '../../compat/@deepseek-ai/dsh-tool-fs/lib/index.js'
    - name: '@deepseek-ai/dsh-tool-present'
    - name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false
    - name: '@deepseek-ai/dsh-tool-web'
    - name: '../../compat/@deepseek-ai/dsh-agent-instructions/lib/index.js'
      config:
        maxBytes: 32768
    - name: '../../compat/@deepseek-ai/dsh-tool-skill/lib/index.js'
    - name: '@deepseek-ai/dsh-tool-jobs'
    - name: '@deepseek-ai/dsh-terminal'
    - name: '../../plugins/web/lib/terminal.js'
    - name: '@deepseek-ai/dsh-tool-terminal'
    - name: '../../compat/@deepseek-ai/dsh-tool-subagent/lib/index.js'
      config:
        provider: spawn
        backgroundMode: continuable
    - name: '@deepseek-ai/dsh-tool-subagent-control'

- id: world-inspection-tools
  name: '../../plugins/web/lib/inspection.js'
