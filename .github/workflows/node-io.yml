name: World IO dataflow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-io-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: CodeQL boundary candidates (review required)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CODEQL_VERSION: v2.27.0
      CODEQL_THREADS: '2'
      CODEQL_RAM: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        id: cli-cache
        with:
          path: ${{ runner.temp }}/codeql-cli
          key: codeql-cli-linux64-${{ env.CODEQL_VERSION }}
      - name: Install verified official CodeQL CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/codeql-cli"
          gh release download "$CODEQL_VERSION" --repo github/codeql-cli-binaries \
            --pattern codeql-linux64.zip --pattern codeql-linux64.zip.checksum.txt --dir "$RUNNER_TEMP/codeql-cli"
          cd "$RUNNER_TEMP/codeql-cli"
          sha256sum -c codeql-linux64.zip.checksum.txt
          unzip -q codeql-linux64.zip
          rm codeql-linux64.zip
      - name: Add CodeQL to PATH
        run: echo "$RUNNER_TEMP/codeql-cli/codeql" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .build/dsh/codeql-cache
          key: codeql-packs-${{ env.CODEQL_VERSION }}-${{ hashFiles('integrations/dsh/checks/codeql/**') }}
      - name: Install locked query libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: codeql pack ci integrations/dsh/checks/codeql --common-caches=.build/dsh/codeql-cache
      - name: Check key regression cases
        run: |
          bash integrations/dsh/checks/codeql/scan.sh integrations/dsh/tests/codeql/fixtures .build/dsh/codeql-fixtures artifacts/dsh/codeql/fixtures
          node integrations/dsh/tests/codeql/check.mjs artifacts/dsh/codeql/fixtures/results.sarif
      - name: Analyze this repository
        run: bash integrations/dsh/checks/codeql/scan.sh . .build/dsh/codeql-repository artifacts/dsh/codeql/repository
      - name: Checkout pinned upstream
        run: |
          revision=$(node -p "JSON.parse(require('fs').readFileSync('integrations/dsh/patches/series.json')).revision")
          repository=$(node -p "JSON.parse(require('fs').readFileSync('integrations/dsh/patches/series.json')).repository")
          git init "$RUNNER_TEMP/dsh-world-io"
          git -C "$RUNNER_TEMP/dsh-world-io" fetch --depth=1 "$repository" "$revision"
          git -C "$RUNNER_TEMP/dsh-world-io" checkout --detach FETCH_HEAD
      - name: Apply verified series in the isolated analysis checkout
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { resolve } from 'node:path';
          const series = JSON.parse(readFileSync('integrations/dsh/patches/series.json', 'utf8'));
          for (const patch of series.patches) {
            if (!/^[\w.-]+\.patch$/.test(patch.file)) throw new Error('Invalid patch name');
            const file = resolve('integrations/dsh/patches', patch.file);
            if (createHash('sha256').update(readFileSync(file)).digest('hex') !== patch.sha256) throw new Error(`Patch checksum mismatch: ${patch.file}`);
            execFileSync('git', ['-C', `${process.env.RUNNER_TEMP}/dsh-world-io`, 'apply', file], { stdio: 'inherit' });
          }
          writeFileSync('artifacts/dsh/codeql/series.json', JSON.stringify(series, null, 2));
          NODE
      - name: Analyze patched upstream (no target build or dependency installation)
        run: bash integrations/dsh/checks/codeql/scan.sh "$RUNNER_TEMP/dsh-world-io" .build/dsh/codeql-upstream artifacts/dsh/codeql/upstream
      - name: Upload candidate paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-io-dataflow-${{ github.sha }}
          path: artifacts/dsh/codeql/
          if-no-files-found: error
          retention-days: 14
