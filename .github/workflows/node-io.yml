name: World IO dataflow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-io-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: CodeQL boundary candidates (review required)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CODEQL_VERSION: v2.27.0
      CODEQL_THREADS: '2'
      CODEQL_RAM: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        id: cli-cache
        with:
          path: ${{ runner.temp }}/codeql-cli
          key: codeql-cli-linux64-${{ env.CODEQL_VERSION }}
      - name: Install verified official CodeQL CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .agents/skills/audit-remote-io-boundaries/scripts/install-cli.sh "$CODEQL_VERSION" "$RUNNER_TEMP/codeql-cli"
      - name: Add CodeQL to PATH
        run: echo "$RUNNER_TEMP/codeql-cli/codeql" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .build/dsh/codeql-cache
          key: codeql-packs-${{ env.CODEQL_VERSION }}-${{ hashFiles('.agents/skills/audit-remote-io-boundaries/codeql/**') }}
      - name: Install locked query libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: codeql pack ci .agents/skills/audit-remote-io-boundaries/codeql --common-caches=.build/dsh/codeql-cache
      - name: Check key regression cases
        run: |
          bash .agents/skills/audit-remote-io-boundaries/scripts/scan.sh .agents/skills/audit-remote-io-boundaries/tests/fixtures "$RUNNER_TEMP/world-io/fixtures" "$RUNNER_TEMP/world-io/reports/fixtures"
          node .agents/skills/audit-remote-io-boundaries/tests/check.mjs "$RUNNER_TEMP/world-io/reports/fixtures/results.sarif"
      - name: Analyze this repository
        run: |
          bash .agents/skills/audit-remote-io-boundaries/scripts/scan.sh . "$RUNNER_TEMP/world-io/repository" "$RUNNER_TEMP/world-io/reports/repository"
          node .agents/skills/audit-remote-io-boundaries/tests/check.mjs "$RUNNER_TEMP/world-io/reports/repository/results.sarif" .agents/skills/audit-remote-io-boundaries/tests/fixtures/cases.ts
      - name: Prepare verified patched upstream
        run: node .agents/skills/audit-remote-io-boundaries/scripts/prepare-upstream.mjs "$RUNNER_TEMP/dsh-world-io" "$RUNNER_TEMP/world-io/reports"
      - name: Analyze patched upstream (no target build or dependency installation)
        run: bash .agents/skills/audit-remote-io-boundaries/scripts/scan.sh "$RUNNER_TEMP/dsh-world-io" "$RUNNER_TEMP/world-io/upstream-db" "$RUNNER_TEMP/world-io/reports/upstream"
      - name: Upload candidate paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-io-dataflow-${{ github.sha }}
          path: ${{ runner.temp }}/world-io/reports/
          if-no-files-found: error
          retention-days: 14
