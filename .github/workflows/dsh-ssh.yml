name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Runtime checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: cargo +1.85.1 fmt --all --check
      - run: cargo +1.85.1 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.85.1 build --locked --workspace --bins
      - run: cargo +1.85.1 test --locked --workspace
      - run: npm run check
      - run: npm test
  ssh:
    name: DSH compatibility and Web / SSH E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: npm ci
      - name: Checkout pinned DSH source
        shell: bash
        run: |
          revision=$(node -p "JSON.parse(require('fs').readFileSync('integrations/dsh/patches/series.json')).revision")
          repository=$(node -p "JSON.parse(require('fs').readFileSync('integrations/dsh/patches/series.json')).repository")
          git init "$RUNNER_TEMP/dsh-source"
          git -C "$RUNNER_TEMP/dsh-source" fetch --depth=1 "$repository" "$revision"
          git -C "$RUNNER_TEMP/dsh-source" checkout --detach FETCH_HEAD
      - name: Build and check patched host
        run: node integrations/dsh/scripts/check-patched-host.mjs "$RUNNER_TEMP/dsh-source"
      - name: Check unchanged-source compatibility and package declarations
        run: |
          node integrations/dsh/scripts/check-composition.mjs "$RUNNER_TEMP/dsh-source"
          node integrations/dsh/scripts/pack-plugin.mjs "$RUNNER_TEMP/dsh-source"
          node integrations/dsh/scripts/check-plugin.mjs "$RUNNER_TEMP/dsh-source"
      - name: Two Linux Worlds over real SSH
        run: node integrations/dsh/scripts/e2e.mjs -- node target/patched-host/admission.mjs
      - name: Build the patched Web host and plugins
        run: node integrations/dsh/scripts/prepare-web-host.mjs "$RUNNER_TEMP/dsh-source"
      - name: Native context regressions on patched source
        working-directory: target/web-host
        run: >-
          pnpm exec vitest run
          packages/skill/skill/tests/skill.spec.ts
          packages/skill/tool-skill/tests/tool-skill.spec.ts
          packages/context/agent-instructions/tests/agent-instructions.spec.ts
          packages/api/session-controller/tests/session-skills.host.spec.ts
      - name: Install Chromium system dependencies
        run: pnpm --dir target/web-host --filter @deepseek-ai/dsh-web-frontend exec playwright install-deps chromium
      - name: Check Web plugin source
        run: node integrations/dsh/scripts/check-web-plugin.mjs
      - name: Skill deployment over two Linux Worlds
        run: node integrations/dsh/scripts/e2e.mjs -- node integrations/dsh/tests/e2e/skills-deployment.mjs
      - name: Browser over two Linux Worlds
        run: node integrations/dsh/scripts/e2e.mjs -- node integrations/dsh/scripts/web-e2e.mjs
      - name: Browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-browser-acceptance
          path: |
            target/web-*.png
            target/web-acceptance/result.json
          if-no-files-found: ignore
          retention-days: 7
