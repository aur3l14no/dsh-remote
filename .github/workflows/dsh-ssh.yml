name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Runtime checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: cargo +1.85.1 fmt --all --check
      - run: cargo +1.85.1 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.85.1 build --locked --workspace --bins
      - run: cargo +1.85.1 test --locked --workspace
      - run: npm run check
      - run: npm test
  ssh:
    name: DSH compatibility and Web / SSH E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: npm ci
      - name: Checkout pinned DSH source
        shell: bash
        run: |
          revision=$(node -p "JSON.parse(require('fs').readFileSync('integrations/dsh/patches/series.json')).revision")
          repository=$(node -p "JSON.parse(require('fs').readFileSync('integrations/dsh/patches/series.json')).repository")
          git init "$RUNNER_TEMP/dsh-source"
          git -C "$RUNNER_TEMP/dsh-source" fetch --depth=1 "$repository" "$revision"
          git -C "$RUNNER_TEMP/dsh-source" checkout --detach FETCH_HEAD
      - name: Build and check patched host
        run: node integrations/dsh/scripts/check-patched-host.mjs "$RUNNER_TEMP/dsh-source"
      - name: Check unchanged-source compatibility and package declarations
        run: |
          node integrations/dsh/scripts/check-composition.mjs "$RUNNER_TEMP/dsh-source"
          node integrations/dsh/scripts/pack-plugin.mjs "$RUNNER_TEMP/dsh-source"
          node integrations/dsh/scripts/check-plugin.mjs "$RUNNER_TEMP/dsh-source"
      - name: Two Linux Worlds over real SSH
        run: node integrations/dsh/scripts/e2e.mjs -- node target/patched-host/admission.mjs
      - name: Install locked official DSH packages
        run: node integrations/dsh/scripts/prepare-official.mjs
      - name: Build only the extension and compatibility packages
        run: node integrations/dsh/scripts/build-extension.mjs "$RUNNER_TEMP/dsh-source" target/official-install
      - name: Install the native bundle into a test profile
        run: node integrations/dsh/scripts/prepare-test-profile.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Installed package identity and version guards
        run: node --test integrations/dsh/tests/packaging/installed.test.mjs
      - name: Native official CLI installation acceptance
        run: node integrations/dsh/scripts/e2e.mjs -- node integrations/dsh/tests/e2e/extension-install.mjs
      - name: Check Web plugin source and prepare test fixtures
        run: |
          node integrations/dsh/scripts/check-web-plugin.mjs
          node integrations/dsh/scripts/check-preview-client.mjs
          node integrations/dsh/scripts/prepare-browser-fixtures.mjs
      - name: Skill deployment over two Linux Worlds
        run: node integrations/dsh/scripts/e2e.mjs -- node integrations/dsh/tests/e2e/skills-deployment.mjs
      - name: Installed-package browser regressions over two Linux Worlds
        run: node integrations/dsh/scripts/e2e.mjs -- node integrations/dsh/scripts/web-e2e.mjs
      - name: Extension prebuild
        uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-extension-${{ github.sha }}
          path: |
            target/packages/dsh-remote-extension-*.tgz
            target/packages/extension-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-browser-acceptance
          path: |
            target/web-*.png
            target/web-acceptance/result.json
            target/web-acceptance/extension-install.json
          if-no-files-found: ignore
          retention-days: 7
